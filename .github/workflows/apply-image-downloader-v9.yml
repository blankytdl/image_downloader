name: Apply supplied project archive
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: contains(github.event.head_commit.message, '[apply-image-downloader-v9]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply archive
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib, shutil, zipfile
          data = b"".join(p.read_bytes() for p in sorted(pathlib.Path(".github/upload/parts").glob("*.txt")))
          archive = pathlib.Path("/tmp/image_downloader_v9.zip")
          archive.write_bytes(base64.b64decode(data))
          target = pathlib.Path("/tmp/image_downloader_v9")
          target.mkdir()
          with zipfile.ZipFile(archive) as z:
              for member in z.infolist():
                  p = pathlib.PurePosixPath(member.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise RuntimeError("Unsafe archive member: " + member.filename)
              z.extractall(target)
          if not (target / "bot.py").is_file():
              raise RuntimeError("Archive does not contain bot.py")
          for src in target.iterdir():
              if src.is_file():
                  shutil.copy2(src, pathlib.Path(".") / src.name)
          for stale in ("main.py", "image_downloader_complete.txt"):
              pathlib.Path(stale).unlink(missing_ok=True)
          shutil.rmtree(".github/upload/parts")
          pathlib.Path(".github/workflows/apply-image-downloader-v9.yml").unlink()
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Sync project from supplied image_downloader v9 ZIP
          file_pattern: .
